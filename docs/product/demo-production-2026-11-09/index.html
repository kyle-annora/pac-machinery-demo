orded findings. The separate 3D capability example is a reference assembly, not PAC CAD.", "CRM, delivered emails, SSO, authenticated reviewer roles and remote multiuser proposal collaboration are not live in the current local application."], "requirements": [{"id": "4.1.1", "requirement": "Capture the project scope up front and generate the quote from the rep's written scope.", "sourceRef": "Section 4.1.1 · C1 6:04–6:17", "sourceType": "Asked", "coverage": "main", "stepIds": ["A07", "A09", "A10", "A11", "A17", "A21"], "proof": "The prepared deal displays the source request and the rep's written application scope. The rep confirms that scope before creating the two drafts. Review and the published proposal show the same scope without retyping.", "gap": "Structured scope exists, but the prepared source-request presentation, explicit confirmation step and deterministic script checkpoint still need production work.", "currentStatus": "partial"}, {"id": "4.1.2", "requirement": "Start quoting after a conversation about the customer's project; support the conversation rather than replace it.", "sourceRef": "Section 4.1.2 · C2 0:58", "sourceType": "Asked", "coverage": "main", "stepIds": ["A06", "A07", "A09", "A10", "A21", "B01", "B13"], "proof": "The presentation explicitly moves to an independently prepared sales deal after a customer conversation. The rep checks missing information, confirms the application, presents the proposal, and answers the customer's later question.", "gap": "The demo must supply the conversation context and prepared follow-up. Website submission must not imply an automatic quote or an implemented inquiry-to-deal integration.", "currentStatus": "working-base"}, {"id": "4.1.3", "requirement": "Keep two or three alternative quotes for one customer opportunity in one deal, including different machine choices.", "sourceRef": "Section 4.1.3 · C2 33:32–34:28", "sourceType": "Asked, then agreed to the deal / quote 1–2–3 framing", "coverage": "partial", "stepIds": ["A07", "A11", "A16", "A20", "A24", "B12", "B14"], "proof": "One deal holds A and B with separate configuration, revision, approval and total. The proposal presents both together. Publishing B Rev 1 preserves A Rev 0 and the prior publication.", "gap": "The main demo proves two alternatives for one R3200. Three alternatives and comparison across different machine families remain a separate catalog and data-model acceptance case.", "currentStatus": "working-base"}, {"id": "4.1.4", "requirement": "Ask for missing required inputs before producing a quote.", "sourceRef": "Section 4.1.4 · C2 25:37–26:09", "sourceType": "Agreed", "coverage": "main", "stepIds": ["A04", "A08", "A09", "A10", "A11"], "proof": "A missing bag width blocks draft creation at A08. The system identifies the missing field, shows the prepared clarification, and creates the drafts only after the rep confirms 12 × 16 inch bags at A10.", "gap": "Current completeness validation gates approval, not initial draft creation. The earlier creation gate and its guided recovery must be implemented; an approval-only error is insufficient evidence for this requirement.", "currentStatus": "partial"}, {"id": "4.1.5", "requirement": "Accept conversational quote requests, including pasted customer emails.", "sourceRef": "Section 4.1.5 · C2 5:33–7:16; 24:52–24:59", "sourceType": "Agreed", "coverage": "partial", "stepIds": ["A07", "A09", "A10"], "proof": "The source email is visible next to suggested structured requirements. The rep can inspect and confirm the prepared values before they enter the quote scope. The explanation says the extraction is a prepared demonstration.", "gap": "A general paste-email intake and live extraction service are not established by this deterministic example. Do not present prepared text or suggested dimensions as a live AI result.", "currentStatus": "not-built"}, {"id": "4.2.1", "requirement": "Configure PAC standard machines and options using their Word quote templates and pricing.", "sourceRef": "Section 4.2.1 · C1 15:47–16:00; C2 28:18", "sourceType": "Asked", "coverage": "main", "stepIds": ["A11", "A12", "A13", "A16", "A24"], "proof": "The R3200 configuration uses the dated source basis and named PAC options. Selecting opener and fingers updates the line items and B total from $33,060 to $40,810 while A stays unchanged.", "gap": "The existing base covers a small R3200 sample. Current PAC validation, broader template ingestion, additional machines and self-service catalog operations are outside this main demonstration.", "currentStatus": "working-base"}, {"id": "4.2.2", "requirement": "Distinguish standard configuration, engineering requirements and special-order items.", "sourceRef": "Section 4.2.2 · C2 11:53; 16:43–17:39", "sourceType": "Agreed", "coverage": "partial", "stepIds": ["A11", "A12", "B05", "B06", "B07", "X-SPECIAL"], "proof": "Catalog options remain standard configured items. A new custom guide is explicitly marked Engineering requirement and cannot be treated as ready while price or timing is unknown. An optional special-order example shows its separate classification.", "gap": "The current base distinguishes a custom engineering amount from standard options, but does not establish a distinct special-order item type or handling policy.", "currentStatus": "partial"}, {"id": "4.2.3", "requirement": "Require a what-and-why description for custom items, engineering hours and material pricing, and a not-final flag until engineering is complete.", "sourceRef": "Section 4.2.3 · C2 16:44; 19:47–20:12", "sourceType": "Agreed", "coverage": "main", "stepIds": ["B06", "B07", "B08", "B09", "B10", "B11"], "proof": "The custom guide records what changes and why. Review blocks while the engineering estimate or lead-time impact is unknown. Four hours × $100/hour plus $100 materials produces a $500 estimate; the proposed $500 customer add-on and one additional week receive a separate recorded review before approval.", "gap": "Current engineering input accepts a description, direct customer amount and additional weeks. Separate why, hours, configurable rate, materials, cost-versus-selling-price fields and engineer attribution still need implementation. All estimate values remain illustrative.", "currentStatus": "partial"}, {"id": "4.2.4", "requirement": "Reflect special-order items in the quote lead time.", "sourceRef": "Section 4.2.4 · C2 17:17", "sourceType": "Agreed", "coverage": "appendix", "stepIds": ["X-SPECIAL"], "proof": "A separately classified special-order item shows its confirmed lead-time impact and changes the displayed quote timing according to the agreed policy.", "gap": "The main story's extra engineering week does not prove special-order handling. A special-order item model, PAC timing rule and optional demonstrator still need to be defined.", "currentStatus": "not-built"}, {"id": "4.2.5", "requirement": "Show accurate prices and lead times while configuring the quote.", "sourceRef": "Section 4.2.5 · C1 4:30; 9:25", "sourceType": "Asked", "coverage": "partial", "stepIds": ["A11", "A12", "A13", "A15", "B07", "B08", "B14"], "proof": "Visible totals follow the selected line items exactly. Pending engineering values remain unknown rather than zero. The sample timing moves from an explicitly illustrative six weeks to seven weeks after the approved one-week addition.", "gap": "Prices come from the 29 January 2025 source basis and are not confirmed current. Actual base lead time and engineering timing require PAC validation. The current base does not contain a confirmed base lead time, so accuracy of live commercial terms cannot yet be claimed.", "currentStatus": "partial"}, {"id": "4.2.6", "requirement": "Control per option whether its cost is included in the base or charged as an add-on.", "sourceRef": "Section 4.2.6 · C2 18:39–19:10", "sourceType": "Asked", "coverage": "partial", "stepIds": ["A11", "A13", "A24", "X-SPECIAL"], "proof": "The main quote makes the machine base, chargeable options and separately charged training explicit. The optional catalog demonstration changes one item's inclusion policy without double counting the base or silently zeroing a charge.", "gap": "The current sample selects chargeable lines; it does not provide a general included-in-base versus add-on control. Training is charged at $5,480 in both alternatives and must never be described as free or included in the machine base.", "currentStatus": "partial"}, {"id": "4.2.7", "requirement": "Support custom features, shipping, spare parts and catalog add-on equipment.", "sourceRef": "Section 4.2.7 · C2 19:10; 20:46", "sourceType": "Agreed", "coverage": "partial", "stepIds": ["A12", "A13", "B06", "B08", "X-SPECIAL"], "proof": "Standard options and the engineering add-on appear as separately identified quote lines. The optional add-on catalog demonstrates shipping, spare parts and auxiliary equipment with their own quantity, charge and timing treatment.", "gap": "The main story demonstrates machine options and one custom feature. Shipping, spare-parts catalogs and general auxiliary equipment are not demonstrated or implemented by those lines; their pricing inputs remain to be supplied.", "currentStatus": "partial"}, {"id": "4.2.8", "requirement": "Make configuration compatibility constraints explicit.", "sourceRef": "Section 4.2.8 · C2 24:59", "sourceType": "Agreed", "coverage": "main", "stepIds": ["A08", "A12", "A13", "A17"], "proof": "Adding the Easy Load Bag Opener exposes its requirement for Seal Flattener Fingers and bags at least 10 inches wide. The incomplete configuration cannot be approved or published; adding the fingers with confirmed 12-inch width resolves the blocker.", "gap": "A working constraint exists for this sample. The production pass still needs the visible blocked state and recovery choreography; a full cross-product constraint matrix requires PAC input.", "currentStatus": "working-base"}, {"id": "4.2.9", "requirement": "Let PAC update pricing and lead-time tables, including broad yearly increases and individual adjustments.", "sourceRef": "Section 4.2.9 · C1 12:22–13:05; C2 17:54", "sourceType": "Asked", "coverage": "appendix", "stepIds": ["X-CATALOG"], "proof": "A catalog administrator previews an across-the-board increase, edits an exception and lead time, reviews the resulting basis, and publishes a new effective version while issued proposal snapshots retain their original basis.", "gap": "The current BASIS is a frozen code constant, not a PAC-editable table. Catalog editing, effective dates, batch adjustment, review, permissions and historical price-basis selection require new implementation.", "currentStatus": "not-built"}, {"id": "4.2.10", "requirement": "Allow PAC to edit the option matrix with internal review of changes.", "sourceRef": "Section 4.2.10 · C2 22:06", "sourceType": "Agreed", "coverage": "appendix", "stepIds": ["X-CATALOG", "X-ROLES"], "proof": "A draft option or compatibility-rule change is visible to a reviewer and cannot become the active catalog until approved. Existing issued proposals remain unchanged.", "gap": "The present options and rules are code-defined. Editable matrices, change review, authorized catalog publication and role policy are not built.", "currentStatus": "not-built"}, {"id": "4.2.11", "requirement": "Provide a price show/hide toggle for internal and customer-facing conversations.", "sourceRef": "Section 4.2.11 · C2 10:09–10:36; 15:42", "sourceType": "Agreed", "coverage": "main", "stepIds": ["A14", "A15"], "proof": "Hide prices removes line prices and totals without altering the configuration or stored values. Show prices restores exactly the same figures. The current presentation mode remains visually obvious.", "gap": "The local toggle is a working base. The guided transition must check that summaries, sticky totals and any visible price-bearing secondary UI obey the same setting. This is presentation control, not a security boundary.", "currentStatus": "working-base"}, {"id": "4.2.12", "requirement": "Allow authorized users to override selling prices, including increases.", "sourceRef": "Section 4.2.12 · C2 20:31–20:46", "sourceType": "Agreed", "coverage": "appendix", "stepIds": ["X-ROLES"], "proof": "An authorized role records a selling-price override and reason. An unauthorized role cannot do so. A price change invalidates the prior approval and appears in the review trail.", "gap": "PAC's override and discount authorities are unresolved. Local form editing or the engineering add-on is not proof of authenticated role-based price overrides.", "currentStatus": "external-input"}, {"id": "4.3.1", "requirement": "Review the quote against the application requirements before issue and record who reviewed it.", "sourceRef": "Section 4.3.1 · C1 4:30–4:50; 5:19; 7:22", "sourceType": "Asked", "coverage": "main", "stepIds": ["A17", "A18", "A19", "A20", "B10", "B11", "B12"], "proof": "Review shows scope, configuration constraints, price, timing and media readiness for each alternative. The demo records a clearly labeled prepared reviewer identity, decision and quote revision. A changed quote cannot reuse an outdated approval.", "gap": "Snapshot approval invalidation exists. Reviewer identity, application-review checklist and immutable actor trail still need work. A prepared demo actor is not an authenticated PAC approval policy.", "currentStatus": "partial"}, {"id": "4.3.2", "requirement": "Provide a quote approval workflow.", "sourceRef": "Section 4.3.2 · C2 8:31", "sourceType": "Asked", "coverage": "main", "stepIds": ["A16", "A17", "A18", "A19", "A20", "B07", "B09", "B10", "B11", "B12"], "proof": "A and B must be saved and individually approved before V1 can publish. Unknown engineering blocks B Rev 1 approval. Once the change is saved, reviewed and approved, V2 publishes without silently reapproving or changing A.", "gap": "Local save, approval and publish gates provide a working base. Named actor recording, real reviewer assignment and remote approval delivery are separate work.", "currentStatus": "working-base"}, {"id": "4.3.3", "requirement": "Apply role-based approval, custom-pricing, price-override and discount-signoff rules.", "sourceRef": "Section 4.3.3 · C2 8:34; 20:25–20:44", "sourceType": "Agreed", "coverage": "partial", "stepIds": ["A17", "A18", "A19", "B08", "B10", "B11", "X-ROLES"], "proof": "The main script distinguishes sales, engineering and reviewer responsibilities with prepared demo actors. The optional policy case verifies who can skip approval, edit custom pricing, override price or approve a discount, including a denied action.", "gap": "Current local actions do not enforce authenticated roles. PAC must name approvers and define skip, override and discount rules; a UI role label cannot stand in for enforcement.", "currentStatus": "external-input"}, {"id": "4.3.4", "requirement": "Notify approvers by email and let them approve through a link in the Annora system.", "sourceRef": "Section 4.3.4 · C2 40:29–41:26", "sourceType": "Agreed", "coverage": "integration", "stepIds": ["A17", "A18", "A19", "B10", "B11", "X-ROLES"], "proof": "In the integrated release, an authorized reviewer receives a real notification, opens the referenced saved revision, approves in the application, and the original sales session observes the recorded decision.", "gap": "Only local approval actions exist. Email delivery, durable review links, recipient authorization and shared status are not live. Prepared email or reviewer screens must be labeled previews, not sent messages.", "currentStatus": "partial"}, {"id": "4.3.5", "requirement": "Make approvals usable while travelling in a browser without VPN, with Google or Microsoft SSO.", "sourceRef": "Section 4.3.5 · C2 41:31–42:43", "sourceType": "Asked", "coverage": "integration", "stepIds": ["X-ROLES"], "proof": "An authorized reviewer can open the hosted application on an ordinary internet connection, sign in through the agreed provider and complete review at supported laptop and mobile sizes without VPN.", "gap": "Browser UI exists but does not establish hosted approval, identity, remote persistence or poor-connectivity behavior. The source asks for travel-friendly access; it does not authorize a promise of offline approval.", "currentStatus": "partial"}, {"id": "4.3.6", "requirement": "Support numbered quote revisions such as Rev 0, Rev 1 and Rev 2.", "sourceRef": "Section 4.3.6 · C2 20:46", "sourceType": "Agreed", "coverage": "main", "stepIds": ["A11", "A20", "B05", "B09", "B11", "B12", "B15"], "proof": "Revising published B Rev 0 creates B Rev 1 as a draft. V2 points to A Rev 0 and B Rev 1; V1 still shows A Rev 0 and B Rev 0 with its original amounts, scope and conversation context.", "gap": "Revision and frozen-publication primitives exist. A deterministic initial state, visible revision comparison and Next-driven sequence still need production work; previous publications in one browser are not portable fixtures.", "currentStatus": "working-base"}, {"id": "4.4.1", "requirement": "Give the rep a customer proposal to present and walk through, not only an emailed quote.", "sourceRef": "Section 4.4.1 · C1 6:20–6:33; C2 28:27–29:07", "sourceType": "Asked", "coverage": "main", "stepIds": ["A20", "A21", "A22", "A23", "A24", "B14"], "proof": "After publication, the presenter opens the actual versioned customer view and explains the need, machine, application fit, options, resources and decision. Internal review controls and costs are absent from that view.", "gap": "The proposal has a working local base. The planned narrative hierarchy, richer media and polished presentation sequence remain to be produced. The forward flow supersedes the older proposal-first demo order.", "currentStatus": "working-base"}, {"id": "4.4.2", "requirement": "Let customers annotate, ask questions and discuss price or lead time inside the proposal.", "sourceRef": "Section 4.4.2 · C2 29:07–30:11", "sourceType": "Asked / Agreed", "coverage": "partial", "stepIds": ["B01", "B02", "B13", "B14", "B15"], "proof": "A customer question attaches to V1 and B Rev 0, appears in sales Activity with the same context, and receives a reply linking V2. The original question remains associated with its original publication.", "gap": "Contextual comments are a working base. Freehand markup, rich annotations and remote shared commenting are not demonstrated by a local text thread and need separate scope.", "currentStatus": "partial"}, {"id": "4.4.3", "requirement": "Allow the customer to share a proposal with teammates so multiple people can review and comment.", "sourceRef": "Section 4.4.3 · C2 31:39–31:58", "sourceType": "Asked", "coverage": "integration", "stepIds": ["B01", "B13", "B14"], "proof": "In the integrated release, two separately authenticated or explicitly authorized customer sessions open the same durable proposal, retain reviewer attribution and see each other's comments without copying browser storage.", "gap": "A local version URL does not carry the saved proposal to another browser. Shared backend persistence, invitation/access policy, reviewer identities and multiuser updates are not live. Seeded personas must not be portrayed as real remote collaborators.", "currentStatus": "not-built"}, {"id": "4.4.4", "requirement": "Present the deal's two or three alternative quotes together and help the customer choose.", "sourceRef": "Section 4.4.4 · C2 33:32–34:28", "sourceType": "Asked", "coverage": "main", "stepIds": ["A21", "A24", "B14"], "proof": "A single versioned proposal compares A's standard loading and B's assisted loading, lists the actual option differences, prices and constraints, and shows the B Rev 1 change without implying that the underlying R3200 has changed.", "gap": "Two alternatives are supported. The primary script does not validate a third quote or a different machine family; comparison copy must explain application tradeoffs rather than merely two prices.", "currentStatus": "working-base"}, {"id": "4.4.5", "requirement": "Embed PAC videos matched to the quoted machine and application to help the customer understand how it runs.", "sourceRef": "Section 4.4.5 · C2 30:40–31:09; 34:28–35:03", "sourceType": "Asked", "coverage": "main", "stepIds": ["A02", "A22", "B14"], "proof": "A22 opens a verified PAC video with a caption naming the demonstrated model, application and configuration. The presenter explains the relevant loading behavior. Playback has a controlled poster and fallback without hiding a configuration mismatch.", "gap": "Verified machine/application clips and their configuration mapping must be supplied or approved. A general PAC video or base-machine clip is not proof of the quoted custom guide or every selected option. This is a production hold until the intended claim is supported.", "currentStatus": "external-input"}, {"id": "4.4.6", "requirement": "Use images and videos that accurately match the exact quoted model and configuration.", "sourceRef": "Section 4.4.6 · C2 32:03–32:33", "sourceType": "Asked / Agreed", "coverage": "main", "stepIds": ["A17", "A22", "B03", "B10", "B14", "X-3D"], "proof": "Each media asset identifies the model and options it supports. Review blocks a claim of exact configuration match when evidence is missing. A base-machine reference is labeled as such; B Rev 1 does not display a fabricated image of the proposed guide.", "gap": "Available photos and the reference 3D assembly do not prove every quoted configuration. PAC-specific CAD and verified custom-guide imagery are unconfirmed. Honest labels avoid deception but do not by themselves satisfy the full exact-configuration requirement.", "currentStatus": "external-input"}, {"id": "4.4.7", "requirement": "Bring relevant PAC videos, drawings, layouts and website material together in the proposal.", "sourceRef": "Section 4.4.7 · C2 31:39; 39:20", "sourceType": "Asked", "coverage": "partial", "stepIds": ["A22", "A23", "B14"], "proof": "The proposal has a concise resources area with actual approved files or links, readable titles, media purpose and version context. Each displayed resource opens the promised content.", "gap": "Current equipment references are a base. Verified videos, drawings, layouts and a versioned resource manifest are not complete. Do not fill empty resource slots with invented engineering documents.", "currentStatus": "partial"}, {"id": "4.4.8", "requirement": "Explain the understood need, machine behavior, application benefits and relevant examples so the customer selects the right solution.", "sourceRef": "Section 4.4.8 · C1 6:33–6:36; C2 34:54–35:15", "sourceType": "Asked", "coverage": "main", "stepIds": ["A10", "A21", "A22", "A24", "B03", "B04", "B14"], "proof": "The proposal begins with the customer's application and loading concern, explains standard versus assisted loading and the confirmed constraints, and later connects the proposed guide to the original question. Customer targets remain distinct from PAC performance commitments.", "gap": "The present scope and option summaries need a stronger application-led explanation and verified visual evidence. Unsupported throughput, fit, savings or operator-effort guarantees must not enter the script.", "currentStatus": "partial"}, {"id": "4.4.9", "requirement": "Attach cover pages, PDFs, drawings and layouts to the appropriate quote or proposal version.", "sourceRef": "Section 4.4.9 · C2 7:23–7:46; 39:20", "sourceType": "Asked", "coverage": "main", "stepIds": ["A23", "B14", "B15"], "proof": "A23 opens a PDF identified with V1, A Rev 0 and B Rev 0. V2 resources identify B Rev 1. Returning to V1 still opens its original document and resource list, with no silent replacement by the latest files.", "gap": "A version-bound attachment manifest and frozen hosted/exported files are not established. PAC drawings/layouts are pending inputs. The main pass must build the PDF/resource binding; absence of drawings must remain explicit.", "currentStatus": "not-built"}, {"id": "4.4.10", "requirement": "Keep PDF quote output available while allowing continued quote editing.", "sourceRef": "Section 4.4.10 · C2 7:31", "sourceType": "Agreed", "coverage": "main", "stepIds": ["A23", "B05", "B09", "B14", "B15"], "proof": "The customer can open or download a legible PDF for the published version. Sales can edit a new working revision and issue an updated PDF, while the prior issued document remains unchanged.", "gap": "Browser print and editable revisions exist. A consistently formatted, version-bound PDF artifact with stable resource handling still needs production work. Editing must create a revision rather than mutate an already issued publication.", "currentStatus": "partial"}, {"id": "4.4.11", "requirement": "Send a proposal link, collect the customer's signature and provide a payment link after signature.", "sourceRef": "Section 4.4.11 · C2 26:36–27:26; 28:23", "sourceType": "Agreed", "coverage": "design", "stepIds": ["A20", "B12", "B13", "X-CLOSE"], "proof": "The optional close-stage design distinguishes presented, awaiting signature, signed, payment requested and paid states. Payment is unavailable before signature. The first-round main path ends with customer feedback and sales follow-up rather than simulating a real signature or charge.", "gap": "The user explicitly chose feedback and revision first, with signature/payment design only. Durable delivery, signing identity, service integration and payment processing are not implemented; a local publication link is not proof of email delivery.", "currentStatus": "partial"}, {"id": "4.5.1", "requirement": "Connect to PAC's CRM, tie customer and opportunity records together, and enforce deal first, then quote number.", "sourceRef": "Section 4.5.1 · C1 7:28; C2 4:38; 9:53–10:09", "sourceType": "Asked", "coverage": "integration", "stepIds": ["A06", "A07", "A08", "A11"], "proof": "The integrated release retrieves or verifies a real CRM customer and opportunity before assigning an official quote number. The main local demonstration instead shows a prepared deal and explicitly labels any CRM reference as sample context.", "gap": "PAC's CRM identity, API, record ownership and quote-number policy are unconfirmed. A prepared deal is not a CRM connection, and the independent Website transition must not imply one.", "currentStatus": "external-input"}, {"id": "4.5.2", "requirement": "Track quote ownership, status, last contact and won/lost outcomes to reduce unobserved follow-up gaps.", "sourceRef": "Section 4.5.2 · C1 10:42–10:54; C2 9:28; 14:24", "sourceType": "Agreed (implied)", "coverage": "partial", "stepIds": ["A07", "B02", "B13", "B16"], "proof": "The final sales view identifies the deal owner, current proposal version, latest recorded customer contact, open question status and dated next action. It does not label a sent reply as a won deal.", "gap": "Local Activity and follow-up provide a base. Reliable last-contact capture, a complete won/lost pipeline, CRM synchronization and organization-wide reporting remain outside the demonstrated loop.", "currentStatus": "partial"}, {"id": "4.5.3", "requirement": "Centralize quoting so every rep follows the same process.", "sourceRef": "Section 4.5.3 · C1 7:02; 7:47", "sourceType": "Asked", "coverage": "main", "stepIds": ["A07", "A10", "A11", "A16", "A17", "A20", "B05", "B09", "B10", "B12", "B16"], "proof": "Both stories follow the same scope, configuration, save, review, approval, publication and follow-up rules. Revisions cannot bypass required information or reuse stale approval.", "gap": "The local application demonstrates process consistency, not an organization-wide deployed service. Multi-rep accounts, shared persistence, administration and operational rollout are separate acceptance work.", "currentStatus": "working-base"}, {"id": "4.6.1", "requirement": "Provide login for PAC users.", "sourceRef": "Section 4.6.1 · C2 7:52", "sourceType": "Asked", "coverage": "integration", "stepIds": ["X-ROLES"], "proof": "Only authorized PAC users can access internal deal data; login, session expiry and logout behave correctly. Customer proposal access remains separately scoped.", "gap": "Current local workspace and customer-view separation are interface boundaries, not authenticated access. A demonstrator role selector must not be represented as real login.", "currentStatus": "not-built"}, {"id": "4.6.2", "requirement": "Support Google or Microsoft single sign-on.", "sourceRef": "Section 4.6.2 · C2 41:53–42:06", "sourceType": "Agreed", "coverage": "integration", "stepIds": ["X-ROLES"], "proof": "A user signs in through PAC's selected identity provider, receives the correct tenant and role, and loses access when the account is no longer authorized.", "gap": "The identity provider, tenant restrictions and role provisioning need PAC confirmation. No SSO integration is active in the local application.", "currentStatus": "not-built"}, {"id": "4.6.3", "requirement": "Let PAC provide feedback, request changes and add products directly or ask Annora to help.", "sourceRef": "Section 4.6.3 · C1 17:04", "sourceType": "Agreed (Patrick stated; Greg acknowledged)", "coverage": "appendix", "stepIds": ["X-CATALOG"], "proof": "A PAC administrator can submit a change request with context or add a draft product, see its review status and choose the agreed Annora support route. Internal product feedback is distinct from a customer's proposal question.", "gap": "Customer comments do not satisfy catalog administration or product feedback. Self-service product creation, administrative review and a defined Annora support workflow are not built.", "currentStatus": "not-built"}, {"id": "4.6.4", "requirement": "Deliver a useful base quickly, then build on it.", "sourceRef": "Section 4.6.4 · C2 38:27", "sourceType": "Asked", "coverage": "main", "stepIds": ["A24", "B16"], "proof": "The demonstration completes one bounded R3200 sales loop and one feedback-to-revision loop. The accompanying scope distinguishes what works locally, what the proposed trial will validate, and what needs PAC input or a later integration.", "gap": "The current application is a usable local base. Trial scope, named owners, input readiness and acceptance remain to be confirmed; a scripted demo does not imply that all 41 requirements are production-complete or committed within two weeks.", "currentStatus": "working-base"}], "annoraBuildDirection": {"sourceRef": "Section 10 · Patrick Byrne notes to Wes, 7 November 2026 [PB]", "notPACRequirements": true, "items": [{"id": "PB-10.1-configurator", "direction": "Use the MPI build as a capability reference for the full configurator, not as a mandate to copy its visual design.", "requirementIds": ["4.2.1", "4.2.2", "4.2.3", "4.2.4", "4.2.5", "4.2.6", "4.2.7", "4.2.8", "4.2.9", "4.2.10", "4.2.11", "4.2.12"], "stepIds": ["A11", "A12", "A13", "A14", "A15", "B06", "B08", "X-CATALOG", "X-SPECIAL", "X-ROLES"], "remaining": "The main story is intentionally narrower than the full configurator requirement set. Optional catalogs, role policies and special-order behavior are not silently counted as delivered."}, {"id": "PB-10.1-engineering", "direction": "Allow an option to carry an engineering requirement with what and why, labor hours at one configurable rate, and material cost.", "requirementIds": ["4.2.2", "4.2.3"], "stepIds": ["B06", "B07", "B08", "B09", "B10", "B11"], "remaining": "Current engineering input is a direct customer amount. Cost build-up and separate customer-price review are new work. The example rate and costs are illustrative; applying engineering requirements to any arbitrary option remains beyond the single custom-guide demonstration."}, {"id": "PB-10.1-approval", "direction": "Provide review, approval and numbered revisions.", "requirementIds": ["4.3.1", "4.3.2", "4.3.3", "4.3.4", "4.3.5", "4.3.6"], "stepIds": ["A16", "A17", "A18", "A19", "A20", "B05", "B07", "B09", "B10", "B11", "B12", "X-ROLES"], "remaining": "A local approval engine is not an authenticated, emailed approval service. Reviewer roles and skip/override policies require PAC decisions."}, {"id": "PB-10.1-proposal", "direction": "Provide both a quote PDF and a presented multi-quote proposal with application benefits, customer comments and matching equipment videos.", "requirementIds": ["4.4.1", "4.4.2", "4.4.3", "4.4.4", "4.4.5", "4.4.6", "4.4.7", "4.4.8", "4.4.9", "4.4.10"], "stepIds": ["A21", "A22", "A23", "A24", "B01", "B13", "B14", "B15"], "remaining": "Machine/application walkthrough content is an Annora working assumption for meeting PAC's goal. Exact media, resources and version-bound PDFs require additional production and PAC validation. Mr Winter is a behavior reference for comments, not a visual template."}, {"id": "PB-10.2-demo-sequence", "direction": "Populate real sample quotes and specific-equipment proposals from PAC source materials.", "requirementIds": ["4.2.1", "4.4.5", "4.4.6"], "stepIds": ["A11", "A20", "A21", "A22", "A23", "A24"], "remaining": "The document's original proposal-first sequence has been superseded by the user's later acceptance of Patrick's forward flow. Do not restore it: Website → prepared sales deal → quote configuration → approval → publication → customer proposal."}, {"id": "PB-10.3-commercial", "direction": "Describe phased delivery and continuing support without treating historical fee examples as approved terms.", "requirementIds": ["4.6.4"], "stepIds": [], "remaining": "Commercial framing belongs in the pitch after the artifact walkthrough. Use the current user-approved two-week free trial followed by mutual confirmation before paid work. Prices, automatic renewal and lead-revenue percentages are not approved."}, {"id": "PB-10.4-inputs", "direction": "Confirm source templates and prices, equipment videos, labor rate and approver roles with PAC.", "requirementIds": ["4.2.1", "4.2.3", "4.2.5", "4.3.3", "4.4.5", "4.4.6"], "stepIds": ["A11", "A17", "A22", "B08", "B10"], "remaining": "The existing dated price basis supports an illustrative demonstration, not current commercial validation. Unconfirmed role policy, base lead time and exact configuration media remain explicit dependencies."}]}, "contextThatMustSurviveProduction": [{"sourceRef": "Sections 2–3 · C1 5:13; 9:15; 10:21–10:34; 14:05–14:47", "rule": "Do not invent a severe quote-production time problem. PAC reported roughly ten minutes to build a quote and typical delivery within 24 hours. Lead with a better buying conversation, structured review, higher win rate and faster close; do not promise an outcome from the demo."}, {"sourceRef": "Section 5 · C1 20:38; Website", "rule": "Website intake and AI search are Annora's partnership value proposition, not PAC's primary discovery ask. Keep the entry sequence brief and reserve most time for quoting and proposal discussion."}, {"sourceRef": "Sections 1 and 9 · Website Instant Quote Machines; C1 7:28", "rule": "The Website's existing Instant Quote and Request A Quote paths must be acknowledged. Their future integration policy and PAC's CRM are unresolved. New product-specific and needs-help routes do not establish a production connection."}, {"sourceRef": "Section 6 · C1 24:18–24:24; 8:28; 10:21; 12:14", "rule": "Do not make auto-drawings, line integration, change-order analytics, more leads or ERP integration prerequisites for the first sales demonstration."}, {"sourceRef": "Sections 7 and 9 · C2 32:38", "rule": "3D model availability is unconfirmed. Photo-based Explorer can support a concrete question and finding; reference 3D is an optional capability preview and cannot supply exact-configuration evidence."}]}, "feedback": {"sources": [{"id": "PB05", "title": "Patrick: Demo Flow and Visuals", "date": "2026-11-05", "location": "Private source supplied by Kyle: Demo Flow and Visuals (1).md", "authority": "Patrick's recorded narrative and demo direction; later user decisions control conflicts.", "note": "Read the complete transcript. The transcript is a single paragraph at line 6, without per-statement timestamps. It describes the wider manufacturing-order context, five sales jobs, persuasive proposals, revisions, and a low-risk commercial decision. Its Website-to-Workspace integration and commercial brainstorming are historical proposals, not current implementation authority."}, {"id": "PB08", "title": "Patrick: storyboard screen-recording feedback", "date": "2026-11-08", "location": "tmp/pdfs/Screen Recording 2026-11-08 at 16.56.37.txt", "authority": "Patrick's later, specific corrections to the demo sequence and offer narrative.", "note": "Read the complete transcript. Locators below are text-file line numbers, not video timecodes. Patrick asks for a forward journey, visible customization and review, customer feedback and revision, a historical baseline, and ongoing value framed around outcomes."}, {"id": "PB07", "title": "Patrick's build direction to Wes", "date": "2026-11-07", "location": "Private source supplied by Kyle: PAC-Machinery-Sales-Workspace-Requirements.md, section 10", "authority": "Annora's proposed implementation approach, explicitly distinguished in the source from statements made by PAC.", "note": "Covers the MPI-style configurator, engineering requirements, quote approval and revision, quote PDF, multi-quote proposals, customer comments, matching videos, and build dependencies. The older Proposal-first presentation order and commercial phases are superseded where they conflict with current user decisions."}, {"id": "PB-SLACK-AEO", "title": "Patrick: AEO evidence, inquiry entry points, and proof-slide placement", "date": "Date not established in the supplied screenshot", "location": "User-supplied Patrick Slack screenshot; https://chatgpt.com/share/6af17b57-16e4-83eb-b11a-091a431935c6; presentation/2026-11-08/evidence/search-records.json", "authority": "Patrick's direction relayed by Kyle, with the shared conversation previously checked and recorded in the repository evidence register.", "note": "Patrick asks to link the conversation, explain a specific-product request and a requirements-based inquiry, and move delivered-customer results to just before the offer. The evidence register records that the new conversation already recommends PAC and that PAC has both general Request Quote and product-page Instant Quote forms. The improvement is richer context and easier next steps, not the invention of an absent form."}, {"id": "PB-CASE-OUTCOMES", "title": "Patrick: delivered customer outcomes", "date": "Date not established in the supplied message", "location": "Patrick feedback pasted by Kyle in the current conversation; existing pitch case-context records", "authority": "Customer outcomes reported by Patrick; not independently verified PAC forecasts.", "note": "MPI: enough order backlog to justify a new factory within nine months of the quoting system going live. Kannegiesser: $1m additional revenue, 5% AOV increase from quoting spare parts with machines, and complex quotes reduced from 40 hours to less than one hour. Mr Winter: doubled quote capacity with the same sales team, and quote plus approval drawing reduced from two hours to five minutes. Use precise attribution and context; do not imply the software alone caused every outcome or promise these results to PAC."}, {"id": "REQ", "title": "PAC Machinery Sales Workspace Requirements", "date": "Prepared 2026-11-04; updated 2026-11-07", "location": "Private source supplied by Kyle: PAC-Machinery-Sales-Workspace-Requirements.md", "authority": "Requirements summary prepared for Wes. Sections 1-9 capture PAC context and requests; section 10 records Annora build direction.", "note": "Use requirement identifiers for the detailed coverage matrix. PAC's priority is helping the existing sales process close more effectively. Templates, pricing, matching equipment videos, labor-rate assumptions, and approver roles require explicit source or confirmation. A planned script is not evidence that every requirement is already implemented."}, {"id": "USER-INDEPENDENCE", "title": "Current user decision: independent Website and Sales Workspace", "date": "Confirmed in the current conversation; rollback documented 2026-11-08", "location": "Current conversation; application/verification/rollback-2026-11-08/README.md", "authority": "Explicit user scope decision; overrides earlier inferred integration and Website-to-Deal handoff plans.", "note": "Website and Sales Workspace are separate artifacts. The presenter may tell a continuous customer story, but no automatic inquiry import, inbox bridge, or Deal creation is implied or restored. Use separate prepared fixtures and a visible presenter role transition. Preserve the working current experience rather than returning to superseded pages."}, {"id": "USER-COMMERCIAL", "title": "Current user decision: two-week free trial and mutual decision to continue", "date": "Confirmed in the current conversation", "location": "Current conversation: explicit selection and repetition of the two-week free-trial terms", "authority": "Explicit current commercial direction; overrides older fee, partner-percentage, and automatic-continuation ideas.", "note": "Two weeks are free. Paid service begins only after both sides confirm the subsequent scope and terms. Do not add automatic billing, an unapproved price, a guaranteed launch date, or a promise of particular sales results. The meeting should secure approval of the trial scope and participants, not fabricate a signed contract."}, {"id": "USER-TWO-ACTS", "title": "Current user decision: two preset linear walkthroughs, script before production", "date": "2026-11-09", "location": "Current conversation: latest approved production-script request", "authority": "Immediate task definition and presentation constraints.", "note": "Prepare a production-ready step script with the page, preset action, state change, and English talk track for every step. Patrick should be able to complete either act by pressing Next. Keep both artifacts independent. Align each step with Patrick's feedback and PAC requirements, then confirm the script before changing artifacts. Screens and speaker notes remain in English."}], "feedback": [{"id": "P01", "request": "Explain the manufacturing-order context, then focus this demo on sales.", "sourceIds": ["PB05", "PB08", "REQ"], "locator": "PB05: full narrative at transcript line 6; PB08: line 3; REQ: PAC objectives and section 10.1.", "implementation": "The pitch introduces the order context before opening the artifacts. Act A demonstrates a clear buying and quoting process; Act B demonstrates how sales handles a customer's question and a revision. Keep the spoken payoff about better customer decisions, quote accuracy, and follow-up rather than claiming an implemented manufacturing execution system.", "stepIds": ["A01", "A07", "A24", "B01", "B16"], "limits": "Factory capacity is business context. No downstream manufacturing system, additional lead volume, or PAC revenue improvement is represented as delivered by these two artifacts."}, {"id": "P02", "request": "Organize the sales story around five jobs, rather than a vague three-step funnel.", "sourceIds": ["PB05", "PB08"], "locator": "PB05: five sales jobs in transcript line 6; PB08: line 5.", "implementation": "Map the jobs to observable moments: relevant discovery in the pitch's AI evidence; finding the right equipment in the Website; requirements capture; quote construction and proposal presentation; and customer feedback plus sales follow-up. Explain where closing fits without extending the first implementation into real signature or payment processing.", "stepIds": ["A01", "A02", "A03", "A04", "A05", "A10", "A11", "A20", "A21", "A24", "B01", "B16", "H01", "H02", "H04"], "limits": "The discovery evidence and eventual commercial closing are wider narrative context. The artifact script does not claim that the entire customer acquisition or payment process is implemented."}, {"id": "P03", "request": "Use the actual AI-search conversation to show why discovery and useful inquiry capture belong together.", "sourceIds": ["PB08", "PB-SLACK-AEO", "REQ"], "locator": "PB08: lines 7 and 9; PB-SLACK-AEO: request to add the shared conversation as a link; evidence/search-records.json: leadCaptureExample.", "implementation": "Keep the verified ChatGPT example and its source link in the pitch before Act A. Explain that the observed conversation already recommends PAC, then show a Website that makes the next buying step easier. State AEO work as improving useful product information and measuring discoverability. Transition explicitly from the medical/shrink search example to the separate illustrative Harbor Components/R3200 sales scenario.", "stepIds": ["A01", "A03", "A04", "A05", "H01", "H04"], "limits": "One conversation is not an AI visibility audit or proof of conversion lift. Do not claim control over AI answers, guaranteed recommendations, verified medical suitability, or that the ChatGPT user's inquiry became the Harbor Deal. Do not replay a fabricated live AI answer."}, {"id": "P04", "request": "Make both Website inquiry intents understandable: request a known product or describe the application and ask for help.", "sourceIds": ["PB05", "PB08", "PB-SLACK-AEO", "USER-TWO-ACTS"], "locator": "PB05: finding needs and capturing requirements; PB08: lines 11 and 13; PB-SLACK-AEO: specific-product request and requirements form.", "implementation": "The primary linear route follows the known R3200 product into a product-aware inquiry with preset contact and application details, a reviewable summary and a Website-only demo receipt. The alternate H01–H04 route captures the same contact and needs with no model selected. Preserve product/application context and the next questions on the receipt. Both paths capture locally; they do not claim delivery to PAC.", "stepIds": ["A01", "A03", "A04", "A05", "H01", "H02", "H03", "H04"], "limits": "PAC already has Request Quote and Instant Quote forms. The demo proposes clearer contextual capture; it does not prove the current backend drops metadata or has no forms. A second entry does not require a second mandatory branch in Patrick's main Next-only route."}, {"id": "P05", "request": "Follow the forward sales sequence; capture requirements before building and presenting the full proposal.", "sourceIds": ["PB08", "PB07", "USER-TWO-ACTS"], "locator": "PB08: lines 11-19; PB07: section 10.2 contains the older Proposal-first order; current user chose Patrick's forward order.", "implementation": "Act A proceeds Website inquiry, sales-side requirement confirmation, A/B configuration, saving, review, approval, publication, and then the full Customer Proposal. An opening outcome preview may remain in the pitch, but the Proposal walkthrough happens only after publication in the scripted sequence.", "stepIds": ["A03", "A04", "A10", "A11", "A16", "A17", "A18", "A19", "A20", "A21", "A24", "H02", "H04"], "limits": "The original Proposal-first demo direction in Requirements section 10.2 is historical and superseded. A teaser must not imply a draft has already been issued."}, {"id": "P06", "request": "Keep narrative continuity without connecting the two independent artifacts.", "sourceIds": ["PB05", "USER-INDEPENDENCE", "USER-TWO-ACTS"], "locator": "PB05: original Website lead transfer idea; USER-INDEPENDENCE: explicit correction and rollback README.", "implementation": "After the Website-only demo receipt, a presenter transition names the role change. Next opens a separately prepared Sales Workspace Deal with a related illustrative brief. The submitted demo inquiry remains in its own Website store; the sales-side email is a prepared input that a rep reviews and confirms. No record is transferred.", "stepIds": ["A05", "A06", "A07", "A09", "A10", "H04"], "limits": "No automatic import, synced inbox, generated Deal, or Website-to-Workspace identifier bridge. Similar customer names and shared narrative context do not constitute an integration. Customer Proposal belongs to the sales quote lifecycle and uses the approved customer-facing brand language."}, {"id": "P07", "request": "Show useful product education and concrete A/B choices, not generic feature screens.", "sourceIds": ["PB08", "PB07", "REQ"], "locator": "PB08: lines 9 and 13; PB07: sections 10.1-10.2; REQ: sections 4.2 and 4.4.", "implementation": "Use equipment imagery and application-specific media. Build Standard loading and Assisted loading as separate quotes for the same Deal. Show the Easy Load Bag Opener dependency and required Seal Flattener Fingers before saving. Demonstrate the customer-facing price visibility choice in context, then compare the correctly priced, approved options in the Proposal.", "stepIds": ["A02", "A11", "A12", "A13", "A14", "A15", "A22", "A24"], "limits": "Only use verified configuration rules and sourced demo prices. The exact matching video, option compatibility, and final commercial terms require their own evidence; general machine footage must not be described as proof of the selected custom configuration."}, {"id": "P08", "request": "Show custom work as an engineering requirement with explicit rationale and pricing inputs.", "sourceIds": ["PB08", "PB07", "REQ"], "locator": "PB08: line 15; PB07: section 10.1, engineering requirements; REQ: 4.2.2-4.2.3 and section 10.4.", "implementation": "Act B turns the customer's application concern into an engineering requirement on the revision of Option B. The script first exposes a missing-input blocker, then enters the custom description and reason, labor hours, configurable assumed hourly rate, materials cost, and stated timing impact. Keep the estimate visible to reviewers before approving the revised quote.", "stepIds": ["B05", "B06", "B07", "B08", "B09", "B10", "B11"], "limits": "Use PAC's term engineering requirement. An assumed demo labor rate is not PAC's approved rate. An estimate or timeline impact does not establish engineering feasibility or a confirmed base lead time. Custom work cannot bypass review simply because the presenter presses Next."}, {"id": "P09", "request": "Make review and approval happen before an offer is published.", "sourceIds": ["PB08", "PB07", "REQ"], "locator": "PB08: line 15; PB07: section 10.1 quote review and approval; REQ: section 4.3.", "implementation": "Distinguish a saved working draft from an approved quote and a published Proposal snapshot. Show both A and B passing review before V1 publication. In Act B, only the revised B follows the review and approval path again before V2 publication. Surface validation failures and resolved state rather than silently forcing approval.", "stepIds": ["A16", "A17", "A18", "A19", "A20", "B07", "B09", "B10", "B11", "B12"], "limits": "Demonstration roles and approval rules are prepared fixtures until PAC confirms who may skip approval and who signs off custom pricing. The script must not conflate save, approve, publish, and customer acceptance."}, {"id": "P10", "request": "Make the Proposal a persuasive customer conversation, supported by the quote document.", "sourceIds": ["PB05", "PB07", "REQ"], "locator": "PB05: proposal should help sell the equipment; PB07: section 10.1 proposal/presentation layer and PDF; REQ: 4.4.1-4.4.10.", "implementation": "After publishing V1, open the customer's needs summary, explain the machine and its application, show matched equipment media, expose version-bound quote resources, and compare both approved choices. Separate buyer benefits from internal estimating and approval details. The rep's English talk track explains the recommendation and invites a question.", "stepIds": ["A20", "A21", "A22", "A23", "A24", "B01"], "limits": "A PDF and a visual Proposal serve different jobs; neither substitutes for the other. No customer signature or payment service is implied by the first demo. Do not use internal notes, engineering assumptions, or invented performance results as confirmed customer-facing promises."}, {"id": "P11", "request": "Show the customer's feedback producing an accountable revision and a clear response.", "sourceIds": ["PB08", "PB07", "REQ"], "locator": "PB08: lines 17 and 19; PB07: section 10.1 customer notes/comments and quote revisions; REQ: sections 4.3-4.4.", "implementation": "Act B starts with a question attached to the published Option B. The sales Activity view preserves that context. A revision records the engineering requirement, review, approval, and V2 publication; a reply explains what changed and points the buyer to V2. Show the prior V1 separately and finish with a visible sales follow-up action.", "stepIds": ["B01", "B02", "B05", "B06", "B09", "B10", "B11", "B12", "B13", "B14", "B15", "B16"], "limits": "Do not edit V1 in place, lose the question's option/version association, imply customer acceptance from an opened link, or pretend an email was delivered when only a local demo reply was recorded."}, {"id": "P12", "request": "Use Explorer where it helps explain equipment or clarify a question; keep it subordinate to the sales task.", "sourceIds": ["PB05", "PB08", "USER-INDEPENDENCE", "USER-TWO-ACTS"], "locator": "PB05: visual product explanation and requirements capture; PB08: lines 9 and 13; current user direction on Explorer and independent artifacts.", "implementation": "Use the Website equipment view for discovery and the Sales Workspace photo Explorer to inspect the area named in the customer question. Capture an observation or finding in that sales context and carry it into the same Deal's revision discussion. Keep any 3D extension optional and explicitly dependent on a suitable, approved model.", "stepIds": ["A02", "B02", "B03", "B04", "B05", "B06"], "limits": "A reference mechanism is not PAC R3200 CAD and cannot establish fit, clearances, operation, or engineering approval. The Website Explorer does not export data into the Sales Workspace. 3D is not a prerequisite for the linear demo or for the quote's commercial correctness."}, {"id": "P13", "request": "Agree a useful baseline and inspect what actually slows down the sales process.", "sourceIds": ["PB08", "REQ", "USER-COMMERCIAL"], "locator": "PB08: line 21; REQ: PAC sales objectives and current process.", "implementation": "Return to the deck after the artifact walkthroughs. Propose a baseline on agreed representative cases: time to prepare a quote/proposal, review and revision effort, missing-information loops, and the ability to follow up with the right customer context. Distinguish functional acceptance during the trial from longer-term close-rate or sales-cycle measurement.", "stepIds": [], "limits": "Do not fabricate PAC baseline numbers, time a preset Next sequence and call it a measured productivity gain, or promise that two weeks establish statistically reliable revenue or win-rate impact."}, {"id": "P14", "request": "Explain the ongoing service through continued operating value and improvement.", "sourceIds": ["PB08", "PB07", "USER-COMMERCIAL"], "locator": "PB08: lines 23-29; PB07: historical section 10.3; USER-COMMERCIAL: current continuation terms.", "implementation": "In the deck return, explain the proposed continuing work: maintain the agreed deployed workflow and catalog/rules, support the sales team, add approved improvements, and review observed outcomes against the baseline. Relate these services to the configuration, review, customer feedback, and follow-up moments just demonstrated.", "stepIds": [], "limits": "These are items to agree in the paid scope, not already contracted entitlements. Do not reuse an unapproved monthly amount, percentage-of-leads model, unlimited-change promise, or guaranteed revenue result from historical brainstorming."}, {"id": "P15", "request": "Place delivered customer results immediately before the trial offer, after PAC has seen the relevant experience.", "sourceIds": ["PB-SLACK-AEO", "PB-CASE-OUTCOMES"], "locator": "Patrick's supplied Slack screenshot: move the delivered-results page much later, possibly just before the offer; Patrick's pasted MPI, Kannegiesser, and Mr Winter outcomes.", "implementation": "Return from Act B to the pitch's proof page, then introduce the two-week trial. Use the reported examples to establish relevant delivery experience: quote capacity, quote/drawing preparation time, spare-parts attachment, and order backlog. Keep the slide concise and place attribution/context in the speaker notes and supporting material.", "stepIds": [], "limits": "These are Patrick-reported customer outcomes, not guaranteed PAC results or controlled causal studies. Keep the original quantities and conditions intact; do not compress Kannegiesser's revenue, AOV, and quote-time outcomes into a different combined claim."}, {"id": "P16", "request": "Finish with a clear trial decision: what is delivered, how it is checked, and how paid continuation is agreed.", "sourceIds": ["PB05", "PB08", "PB07", "USER-COMMERCIAL"], "locator": "PB05: low-risk decision with decision makers present; PB08: lines 29-31; PB07: historical section 10.3; current user commercial decision.", "implementation": "The deck's closing sequence asks PAC to approve a bounded two-week free trial on mutually selected machines and cases, name participants/approvers, and schedule kickoff and review. Define acceptance as walking the agreed cases through configuration, review, publication, customer feedback, and revision with checked outputs and recorded issues. At review, agree whether to continue and confirm paid scope and terms before service becomes chargeable.", "stepIds": [], "limits": "The final meeting sign-off concerns the Annora trial; it is not a customer acceptance button inside the PAC Proposal. No automatic billing, unspecified full-system delivery in two weeks, guaranteed launch, unapproved fee, or promise to reproduce other customers' commercial outcomes."}, {"id": "P17", "request": "Make the two acts reliable for a presenter who only presses Next.", "sourceIds": ["USER-TWO-ACTS", "USER-INDEPENDENCE"], "locator": "Latest approved request: production-ready steps, preset actions and state changes, English talk tracks, independent artifacts, confirm script before production.", "implementation": "Specify deterministic fixtures and a named visible result for every step. Next performs the preset interaction and stops on the resulting page/state. A08, A12 and B07 complete when their expected validation block is visible; the following Next enters the defined resolution. Unexpected validation or loading failures stop advancement. Keep presenter notes separate from the audience screen, allow either act to start from its own known snapshot, and define reset/re-entry behavior.", "stepIds": ["A01", "A06", "A08", "A12", "A16", "A20", "A24", "B01", "B07", "B12", "B16", "H01", "H04"], "limits": "This deliverable defines the production script, not completed automation or already-implemented functionality. Do not modify either artifact before script confirmation. Preset narration and fixtures must not hide a broken rule, manufacture an external send, or make simulated state look like a live customer transaction. A demo receipt records local Website capture only, not external delivery."}, {"id": "P18", "request": "Make data and asset readiness part of production acceptance.", "sourceIds": ["PB07", "REQ", "USER-TWO-ACTS"], "locator": "PB07: section 10.4 dependencies; REQ: sections 7 and 9 plus individual configuration/proposal requirements.", "implementation": "Before building the scripted scenes, verify each quoted machine and option against the available templates/pricing; record any illustrative fixture explicitly. Confirm matching media, approver rules, labor-rate assumptions, and the boundaries of custom work. Keep a source register and a requirement-by-requirement coverage matrix alongside this feedback alignment so production can distinguish primary flow, optional branch, and deferred integration.", "stepIds": ["A02", "A11", "A12", "A13", "A17", "A22", "A23", "B06", "B08", "B10"], "limits": "Availability of a public product image or a previous prototype is not evidence that pricing, compatibility, an engineering estimate, or an approval role is confirmed. Do not substitute historical visual output for the current design rules or claim all requirements are covered by the main two acts."}]}}</script><script>
const DATA=JSON.parse(document.getElementById('reviewData').textContent),S=DATA.script,R=DATA.requirements,F=DATA.feedback;
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=value=>value===null?'Not specified':typeof value==='boolean'?(value?'Yes':'No'):String(value??'');
const pretty=value=>String(value).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
const arr=value=>Array.isArray(value)?value:value===undefined||value===null?[]:[value];
function tree(value){if(Array.isArray(value))return `<ul class="tree">${value.map(item=>`<li>${typeof item==='object'&&item!==null?tree(item):escapeHTML(text(item))}</li>`).join('')}</ul>`;if(value&&typeof value==='object')return `<ul class="tree">${Object.entries(value).map(([key,item])=>`<li><strong>${escapeHTML(pretty(key))}:</strong> ${typeof item==='object'&&item!==null?tree(item):escapeHTML(text(item))}</li>`).join('')}</ul>`;return `<p>${escapeHTML(text(value))}</p>`;}
const paragraphs=value=>arr(value).map(p=>`<p>${escapeHTML(p)}</p>`).join('');
const refs=(ids,type)=>`<div class="inline-refs">${arr(ids).map(id=>`<a href="#${type}/${encodeURIComponent(id)}">${escapeHTML(id)}</a>`).join('')||'<span class="small">No direct reference assigned</span>'}</div>`;
const sourceRefs=ids=>refs(ids,'source');
const allActs=arr(S.acts),alternativeActs=arr(S.alternatives),mainSteps=allActs.flatMap(act=>arr(act.steps).map((step,index)=>({...step,act,index,optional:false}))),optionalSteps=alternativeActs.flatMap(act=>arr(act.steps).map((step,index)=>({...step,act,index,optional:true}))),steps=[...mainSteps,...optionalSteps],byId=new Map(steps.map(step=>[step.id,step]));
const requirementList=arr(R.requirements),feedbackList=arr(F.feedback),sourceList=arr(F.sources),sourceMap=new Map(sourceList.map(s=>[s.id,s]));
const main=document.getElementById('main'),sidebar=document.getElementById('sidebar');
let route={type:'overview'},requirementQuery='',requirementCoverage='all';
function stepLinks(act){return `<div class="nav-group"><div class="nav-label">${escapeHTML(act.id)} · ${escapeHTML(act.title)}</div>${arr(act.steps).map(step=>`<a class="step-link" href="#${encodeURIComponent(step.id)}" ${route.id===step.id?'aria-current="step"':''}><span class="step-id">${escapeHTML(step.id)}</span><span>${escapeHTML(step.title)}</span></a>`).join('')}</div>`;}
function navigation(){sidebar.innerHTML=allActs.map(stepLinks).join('')+(optionalSteps.length?`<details class="nav-group" ${route.type==='step'&&byId.get(route.id)?.optional?'open':''}><summary>Optional presets</summary>${alternativeActs.map(stepLinks).join('')}</details>`:'');document.querySelectorAll('.topnav a').forEach(a=>{const key=a.dataset.view,active=key===route.type||(key==='script'&&route.type==='step')||(key==='feedback'&&route.type==='source');a.toggleAttribute('aria-current',active);if(active)a.setAttribute('aria-current','page')});}
function optionalPresets(printing=false){return `<section class="section"><h2>Optional presets and supplementary demonstrations</h2><p class="small">These sit outside the two main linear walkthroughs. They do not add branches to Patrick’s Next-only route.</p>${arr(S.alternatives).map(item=>`<${printing?'section':'details'} class="${printing?'section':'detail'}">${printing?`<h3>${escapeHTML(item.id)} · ${escapeHTML(item.title)}</h3>`:`<summary>${escapeHTML(item.id)} · ${escapeHTML(item.title)}</summary>`}<div class="detail-body"><p>${escapeHTML(item.summary)}</p>${item.contract?tree(item.contract):''}${arr(item.steps).length?`<p><a href="#${encodeURIComponent(item.steps[0].id)}">Review ${arr(item.steps).length} optional steps →</a></p>`:'<p class="small">Production contract only; no step-by-step demonstration is included in the main route.</p>'}</div></${printing?'section':'details'}>`).join('')}</section>`;}
function actSeconds(act){return arr(act.steps).reduce((sum,step)=>sum+Number(step.seconds||0),0);}
function overview(){return `<span class="eyebrow">Production script · ${mainSteps.length} main steps · ${requirementList.length} requirement records</span><h1>${escapeHTML(S.title)}</h1><p class="lead">${escapeHTML(S.summary)}</p><p class="scope-note">Review the future sequence here. The Next button changes script cards only; it does not run, save, publish or approve actions in either artifact.</p><section class="section grid">${allActs.map(act=>`<article class="box act-card"><span class="eyebrow">${escapeHTML(act.id)} · ${Math.round(actSeconds(act)/60*10)/10} minutes</span><h2>${escapeHTML(act.title)}</h2><p>${escapeHTML(act.summary)}</p><p class="small">${arr(act.steps).length} steps · ${escapeHTML(act.entryCheckpoint||'')} → ${escapeHTML(act.exitCheckpoint||'')}</p><a class="action start" href="#${encodeURIComponent(act.steps?.[0]?.id||'overview')}">Review ${escapeHTML(act.id)} <span aria-hidden="true">→</span></a></article>`).join('')}</section><section class="section"><h2>Production boundaries</h2><div class="box">${tree(S.decisions||[])}</div></section><details class="detail"><summary>Scenario and fixed inputs</summary><div class="detail-body">${tree(S.scenario||{})}</div></details><details class="detail"><summary>Playback and recovery contract</summary><div class="detail-body">${tree(S.playback||{})}</div></details>${optionalPresets()}<section class="section"><h2>Before this can become the live demo</h2>${arr(S.productionGates).map(g=>`<div class="requirement"><div class="req-heading"><span class="req-id">${escapeHTML(g.id)}</span><h2>${escapeHTML(g.title)}</h2></div><p>${escapeHTML(g.criterion)}</p></div>`).join('')}</section><section class="section"><h2>Acceptance checks</h2><ul class="checklist">${arr(S.acceptance).map(item=>`<li>${escapeHTML(typeof item==='object'?JSON.stringify(item):item)}</li>`).join('')}</ul></section>`;}
function stepBody(step,printing=false){const page=step.page||{};return `<span class="eyebrow">${escapeHTML(step.act?.id||'')} · ${escapeHTML(step.id)} · ${step.seconds||0} seconds${step.optional?' · Optional preset':''}</span><h1>${escapeHTML(step.title)}</h1><div class="meta-row"><div><span class="field-label">Page</span><strong>${escapeHTML(page.artifact)} / ${escapeHTML(page.name)}</strong>${page.target&&String(page.target).trim()!==String(page.name||'').trim()?`<span class="small">${escapeHTML(page.target)}</span>`:''}</div><div><span class="field-label">Role</span><strong>${escapeHTML(step.role)}</strong><span class="small">Current readiness: ${escapeHTML(page.readiness)}</span></div></div><section class="step-action"><span class="eyebrow">Preset action on entry</span><p>${escapeHTML(step.action)}</p></section><div class="grid state-pair"><section class="box"><h2>Before</h2>${tree(step.before||[])}</section><section class="box"><h2>After</h2>${tree(step.after||[])}</section></div><section class="proof"><h2>Audience should see</h2>${tree(step.visible||[])}</section><section class="speech"><span class="eyebrow">Spoken script · English</span>${paragraphs(step.script||[])}</section>${printing?`<section class="section"><h2>Prepared input</h2>${tree(step.preset||{})}${step.checkpoint?`<p><strong>Checkpoint:</strong> ${escapeHTML(step.checkpoint)}</p>`:''}</section><section class="section"><h2>Production notes</h2>${tree(step.buildNotes||[])}</section><p>Requirements: ${escapeHTML(arr(step.requirements).join(', '))} · Feedback: ${escapeHTML(arr(step.feedback).join(', '))}</p>`:`<details class="detail"><summary>Prepared input and checkpoint</summary><div class="detail-body">${tree(step.preset||{})}${step.checkpoint?`<p><strong>Checkpoint:</strong> ${escapeHTML(step.checkpoint)}</p>`:''}</div></details><details class="detail"><summary>Requirements, feedback and production notes</summary><div class="detail-body"><div><h3>PAC requirements</h3>${refs(step.requirements,'requirements')}</div><div><h3>Patrick feedback</h3>${refs(step.feedback,'feedback')}</div><div><h3>Production notes</h3>${tree(step.buildNotes||[])}</div></div></details>`}`;}
function sequenceFor(step){return step.optional?optionalSteps.filter(s=>s.act.id===step.act.id):mainSteps;}
function stepPage(step){const sequence=sequenceFor(step),index=sequence.findIndex(s=>s.id===step.id),next=sequence[index+1]||(step.id==='H04'?byId.get('A06'):undefined);return stepBody(step)+`<nav class="step-controls" aria-label="Script navigation"><button class="secondary" id="previous" ${index===0?'disabled':''}>← Previous</button><span class="control-copy">${index+1} / ${sequence.length}${step.optional?' optional steps':' main steps'} · Script review only</span><button class="action" id="next">${next?(next.act.id!==step.act.id?'Next: '+escapeHTML(next.act.id):'Next'):(step.optional?'Back to overview':'Finish script review')} <span aria-hidden="true">→</span></button></nav>`;}
function stepRefLinks(ids){return `<div class="inline-refs">${arr(ids).map(id=>byId.has(id)?`<a href="#${encodeURIComponent(id)}">${escapeHTML(id)}</a>`:`<span class="tag">${escapeHTML(id)}</span>`).join('')||'<span class="small">Outside the main demonstration</span>'}</div>`;}
function requirementCard(req,open=false){return `<article class="requirement anchor-target" id="req-${escapeHTML(req.id)}"><div class="req-heading"><span class="req-id">${escapeHTML(req.id)}</span><h2>${escapeHTML(req.requirement)}</h2></div><div class="req-status"><span class="tag blue">Planned: ${escapeHTML(req.coverage)}</span><span class="tag">Current: ${escapeHTML(req.currentStatus)}</span><span class="tag">${escapeHTML(req.sourceType||'')}</span></div>${stepRefLinks(req.stepIds)}<details ${open?'open':''}><summary>Proof, remaining gap and source</summary><dl><dt>Required visible proof</dt><dd>${escapeHTML(req.proof)}</dd><dt>Remaining gap</dt><dd>${escapeHTML(req.gap)}</dd><dt>Source</dt><dd>${escapeHTML(typeof req.sourceRef==='object'?JSON.stringify(req.sourceRef):req.sourceRef)}</dd></dl></details></article>`;}
function requirementContext(){const sections=[['metadata','Source metadata'],['source','Source and scope'],['interpretation','How to interpret coverage'],['coverageDefinitions','Planned coverage definitions'],['currentStatusDefinitions','Current implementation status definitions'],['sampleBoundaries','Sample boundaries'],['contextThatMustSurviveProduction','Context that must survive production']];return sections.filter(([key])=>R[key]).map(([key,title])=>`<section class="subsection"><h3>${escapeHTML(title)}</h3>${tree(R[key])}</section>`).join('');}
function requirementsPage(id){const selected=id?requirementList.filter(r=>r.id===id):requirementList,values=[...new Set(requirementList.map(r=>r.coverage))];return `<span class="eyebrow">PAC requirements · Sections 4.1–4.6</span><h1>${id?'Requirement '+escapeHTML(id):'Every requirement has a destination.'}</h1><p class="lead">Planned demonstration coverage and the current implementation baseline are separate. A step in this script is not evidence that its functionality has been built.</p>${id?'<p class="section"><a href="#requirements">← All requirements</a></p>':`<div class="coverage-summary">${values.map(value=>`<span class="tag">${escapeHTML(value)} · ${requirementList.filter(r=>r.coverage===value).length}</span>`).join('')}</div><div class="filters"><label class="sr-only" for="requirementSearch">Search requirements</label><input id="requirementSearch" type="search" placeholder="Search by requirement, ID or topic" value="${escapeHTML(requirementQuery)}"><label class="sr-only" for="coverageFilter">Planned coverage</label><select id="coverageFilter"><option value="all">All planned coverage</option>${values.map(value=>`<option ${requirementCoverage===value?'selected':''} value="${escapeHTML(value)}">${escapeHTML(pretty(value))}</option>`).join('')}</select></div>`}<div id="requirementResults">${selected.map(req=>requirementCard(req,Boolean(id))).join('')}</div><details class="detail"><summary>Coverage definitions and source scope</summary><div class="detail-body">${requirementContext()}</div></details>${R.annoraBuildDirection?`<details class="detail"><summary>Annora build direction · Section 10</summary><div class="detail-body">${tree(R.annoraBuildDirection)}</div></details>`:''}`;}
function feedbackCard(item){return `<article class="feedback-item anchor-target" id="feedback-${escapeHTML(item.id)}"><span class="eyebrow">${escapeHTML(item.id)}</span><h2>${escapeHTML(item.request)}</h2><p>${escapeHTML(item.implementation)}</p>${stepRefLinks(item.stepIds)}<p class="source-line">${escapeHTML(item.locator)}</p>${sourceRefs(item.sourceIds)}${item.limits?`<div class="scope-note">${typeof item.limits==='object'?tree(item.limits):escapeHTML(item.limits)}</div>`:''}</article>`;}
function feedbackPage(id){const selected=id?feedbackList.filter(f=>f.id===id):feedbackList;return `<span class="eyebrow">Patrick feedback and current decisions</span><h1>${id?'Feedback '+escapeHTML(id):'The narrative follows the source intent.'}</h1><p class="lead">Patrick’s direction informs the story. Later user decisions control artifact independence, the forward sequence and the free trial terms.</p>${id?'<p class="section"><a href="#feedback">← All feedback</a></p>':''}${selected.map(feedbackCard).join('')}<section class="section"><h2>Source register</h2>${sourceList.map(sourceCard).join('')}</section>`;}
function sourceCard(source){return `<article class="source-card anchor-target" id="source-${escapeHTML(source.id)}"><h3>${escapeHTML(source.id)} · ${escapeHTML(source.title)}</h3><p>${escapeHTML(source.date)} · ${escapeHTML(source.authority)}</p><p>${/^https?:\/\//.test(source.location||'')?`<a href="${escapeHTML(source.location)}" target="_blank" rel="noopener">Open original source ↗</a>`:escapeHTML(source.location)}</p><p>${escapeHTML(source.note)}</p></article>`;}
function filesPage(){const files=[['README.md','Read this first','How to review, approve and hand off this production pack.'],['PRODUCTION-SCRIPT.md','Full production script','Every step, preset, state change and spoken line.'],['REQUIREMENTS-COVERAGE.md','PAC requirements coverage','Planned proof, current gaps and source citations.'],['FEEDBACK-ALIGNMENT.md','Patrick feedback alignment','Source register and explicit production decisions.'],['script.json','Canonical script data','Structured source for the production handoff.'],['requirements.json','Requirements data','Requirement-by-requirement records.'],['feedback.json','Feedback data','Source register and feedback records.']];return `<span class="eyebrow">Editable handoff files</span><h1>Read, annotate and approve the script.</h1><p class="lead">These are production documents. The Website, Sales Workspace and Pitch remain unchanged by this review pack.</p><div class="file-list">${files.map(([path,title,summary])=>`<a href="${path}" download><strong>${title} ↓</strong><span>${summary}</span></a>`).join('')}</div><section class="section"><button class="secondary" id="printScript">Print full script and coverage</button></section>`;}
function finishPage(){return `<div class="finish"><span class="eyebrow">End of the main script</span><h1>Ready for a production decision.</h1><p class="lead">Confirm the sequence, the fixed scenario, the acceptance evidence and the remaining production gates before building either artifact.</p><p class="section">Finishing this reader does not approve the script or execute a demo action. Record agreed changes in the source documents.</p><a class="action" href="#requirements">Review requirement coverage →</a><p class="section"><a href="#${encodeURIComponent(mainSteps[0]?.id||'overview')}">Return to the first step</a> · <a href="#overview">Overview</a></p></div>`;}
function navigateStep(direction){if(route.type!=='step')return;const step=byId.get(route.id),sequence=sequenceFor(step),index=sequence.findIndex(s=>s.id===step.id),target=sequence[index+direction]||(direction>0&&step.id==='H04'?byId.get('A06'):undefined);if(target)location.hash=target.id;else if(direction>0)location.hash=step.optional?'overview':'complete';}
function filterRequirements(){const q=requirementQuery.trim().toLowerCase(),filtered=requirementList.filter(r=>(requirementCoverage==='all'||r.coverage===requirementCoverage)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));document.getElementById('requirementResults').innerHTML=filtered.map(r=>requirementCard(r)).join('')||'<p class="empty">No matching requirements.</p>';}
function render(){let hash=decodeURIComponent(location.hash.slice(1)||'overview'),parts=hash.split('/');route=byId.has(hash)?{type:'step',id:hash}:{type:parts[0],id:parts[1]};if(!['step','overview','requirements','feedback','source','files','complete'].includes(route.type))route={type:'overview'};main.classList.toggle('is-step',route.type==='step');if(route.type==='step')main.innerHTML=stepPage(byId.get(route.id));else if(route.type==='requirements')main.innerHTML=requirementsPage(route.id);else if(route.type==='feedback')main.innerHTML=feedbackPage(route.id);else if(route.type==='source')main.innerHTML=`<span class="eyebrow">Source register</span><h1>Source context</h1>${sourceMap.has(route.id)?sourceCard(sourceMap.get(route.id)):'<p class="empty">Source not found.</p>'}<p class="section"><a href="#feedback">← Feedback alignment</a></p>`;else if(route.type==='files')main.innerHTML=filesPage();else if(route.type==='complete')main.innerHTML=finishPage();else main.innerHTML=overview();navigation();document.getElementById('previous')?.addEventListener('click',()=>navigateStep(-1));document.getElementById('next')?.addEventListener('click',()=>navigateStep(1));document.getElementById('printScript')?.addEventListener('click',()=>window.print());document.getElementById('requirementSearch')?.addEventListener('input',event=>{requirementQuery=event.target.value;filterRequirements()});document.getElementById('coverageFilter')?.addEventListener('change',event=>{requirementCoverage=event.target.value;filterRequirements()});if(route.type==='requirements'&&!route.id)filterRequirements();sidebar.classList.remove('open');document.getElementById('navToggle').setAttribute('aria-expanded','false');window.scrollTo(0,0);document.title=(route.type==='step'?byId.get(route.id).id+' · '+byId.get(route.id).title:'PAC demo production script')+' · Script review';document.getElementById('announcer').textContent=route.type==='step'?byId.get(route.id).id+': '+byId.get(route.id).title:pretty(route.type);}
document.querySelector('[data-view=script]').href='#'+(mainSteps[0]?.id||'overview');document.getElementById('navToggle').addEventListener('click',()=>{const open=sidebar.classList.toggle('open');document.getElementById('navToggle').setAttribute('aria-expanded',String(open))});document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey||event.target.isContentEditable||/^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName))return;if(event.key==='ArrowRight'&&route.type==='step'){event.preventDefault();navigateStep(1)}if(event.key==='ArrowLeft'&&route.type==='step'){event.preventDefault();navigateStep(-1)}});window.addEventListener('hashchange',render);
document.getElementById('printBook').innerHTML=`<h1>${escapeHTML(S.title)}</h1><p>Draft for script approval · Script review only</p><p>${escapeHTML(S.summary)}</p><h2>Production boundaries</h2>${tree(S.decisions||[])}<h2>Scenario</h2>${tree(S.scenario||{})}<h2>Playback contract</h2>${tree(S.playback||{})}${steps.map(step=>`<article class="print-step">${stepBody(step,true)}</article>`).join('')}${optionalPresets(true)}<section class="print-section"><h1>Production gates and acceptance</h1>${tree(S.productionGates||[])}${tree(S.acceptance||[])}</section><section class="print-section"><h1>PAC requirements coverage</h1>${requirementContext()}${requirementList.map(req=>requirementCard(req,true)).join('')}</section><section class="print-section"><h1>Patrick feedback alignment</h1>${feedbackList.map(feedbackCard).join('')}<h2>Sources</h2>${sourceList.map(sourceCard).join('')}</section>`;render();
</script></body></html>
