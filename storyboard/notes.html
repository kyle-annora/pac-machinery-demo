   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

 the order","subtitle":"Begin with the decisions that move work forward","kind":"business-map","seconds":20,"onScreen":["Sales","Engineering","Planning","Procurement","Manufacturing","Delivery & service"],"narration":["An order passes from sales through engineering and planning to production and service. We start with the decisions that shape that order.","For PAC, that means preparing the right quote during the customer conversation. Today's proposed work is focused on sales."],"transition":"Let us show you the part of that journey we propose to improve first."},{"id":"02-outcome","chapter":"The opportunity","title":"Build the right quote in the conversation","kind":"promise","seconds":30,"onScreen":["Understand the application","Explain the options","Help the customer decide"],"narration":["Today we will follow one buyer: how they find useful equipment information, how their application becomes a quote, and how your team presents and revises the offer.","Your priority is a better sales conversation and a faster path to a decision. Product discovery supports that work. These are storyboard views of the proposed experience; the working system and its evidence are still to be validated with PAC."],"transition":"Before that conversation begins, the buyer has a question."},{"id":"03-search","chapter":"AI search","title":"A buyer starts with a question","kind":"search-query","seconds":25,"onScreen":["Who supplies automated bagging equipment for hardware kits?"],"narration":["Imagine a buyer at Harbor Components looking for a better way to package hardware kits. They may ask this question before they know a machine name or a supplier.","We would test a small set of relevant buyer questions and examine the answers. This is one proposed test query, not a search result or a claim about how often customers use AI."],"transition":"The useful question is what this buyer actually sees in the answer."},{"id":"04-evidence","chapter":"AI search","title":"What does the buyer actually see?","subtitle":"Observe the answer before deciding what to improve","kind":"search-evidence","seconds":45,"onScreen":["Evidence capture pending","Product fit","Supporting sources"],"narration":["In the completed demonstration, this space will show the original query and its actual result, with the service and date recorded. We will check whether PAC appears, whether the equipment explanation is accurate and whether the cited information helps the buyer take a useful next step.","If PAC appears, that is part of the evidence. If it does not, one result is a starting observation. We use the review to identify content worth improving; we do not promise a ranking or infer a universal absence."],"transition":"Whether the buyer comes through AI search, Google or a referral, the next question is the same: does PAC have the right equipment for this application?"},{"id":"05-website","chapter":"The buyer's experience","title":"Make the application easier to explain","subtitle":"A public website for the buyer","kind":"website","seconds":60,"onScreen":["Hardware kits","Equipment and application details","See the equipment in use","Discuss your application"],"narration":["The buyer needs to understand what equipment could suit the application, how it works and which details PAC needs to evaluate it. Relevant photos, video and product information can answer those questions before the call.","For our example, the buyer describes manual loading and asks to compare it with assisted bag opening. That context can accompany the inquiry. This public website is independent of the sales workspace. Better content may belong on your current site; a complete website replacement is a separate scope decision."],"transition":"The inquiry starts a sales conversation. Let's jump to the proposal PAC would present after confirming the requirements—then we'll show how the team builds it."},{"id":"06-proposal","chapter":"The buyer's experience","title":"Compare the options together","subtitle":"Illustrative scenario · Harbor Components","kind":"proposal","seconds":70,"onScreen":["Your application","A · Standard loading","B · Assisted bag opening","Compare the scope, price and lead time"],"narration":["This is the proposal PAC would present to its own customer. It begins with what your team understood, then compares two quotes from the same deal. The customer can discuss why an option matters, its price and lead-time implications, and video of the actual equipment being quoted.","The formal quote PDF remains available. The proposal adds a shared place to explain the choices and collect questions from operations and purchasing. In this example the initial alternatives exclude a possible custom guide until the customer decides whether to include it."],"transition":"How would your team create this? We will return to the same inquiry and build the quote from its requirements."},{"id":"07-requirements","chapter":"The seller's workflow","title":"Let the application guide the selection","subtitle":"The same customer, now in the sales workspace","kind":"requirements","seconds":65,"onScreen":["Confirm application requirements","Associate CRM deal","Create quote","Recommended / All machines"],"narration":["The salesperson starts with the customer's words, confirms the application and resolves missing details such as material and target throughput. The deal is associated with PAC's existing CRM before a formal quote number can be issued.","Create quote leads directly to machine selection. Recommendations should explain their basis and any unresolved conditions. The salesperson can also view all machines and make a different choice. For this demonstration, the inquiry would be entered manually or opened as an identified sample record."],"transition":"With a machine selected, the customer conversation becomes a set of explicit options."},{"id":"08-configuration","chapter":"The seller's workflow","title":"Make each choice visible","kind":"configuration","seconds":65,"onScreen":["Included / Add-on options","Create alternative","Price & lead time","Save draft"],"narration":["The configurator separates what is included from optional additions. The rep can explain a selection while the customer sees its effect on the quote and the expected lead time.","We would save the standard setup as quote A and create a separate alternative B for assisted bag opening. An alternative is a different offer, not a revision of A. Prices and available combinations must come from PAC's approved records."],"transition":"Once the choices are agreed, the team needs a clear boundary between a working draft and an issued offer."},{"id":"09-issue","chapter":"The seller's workflow","title":"Review before the offer goes out","kind":"publish","seconds":50,"onScreen":["Save & review","Issue Rev 0","Preview & publish","Quote PDF"],"narration":["The rep saves the quote and follows PAC's review rules. An authorized person issues the approved revision. The proposal then references those exact quote revisions, with matching attachments and equipment media.","After an internal preview, the rep publishes the customer version. That is how we would create the proposal you saw earlier. Approvals, formal numbering and publication each have their own meaning; none should be implied by an attractive preview."],"transition":"Now the customer comes back with a change: they want the custom guide included in option B."},{"id":"10-revision","chapter":"The seller's workflow","title":"Revise without losing the history","kind":"revision","seconds":75,"onScreen":["Add a custom guide","Engineering: description, hours, materials","Review Rev 1 · Publish V2","Keep V1"],"narration":["Operations asks about the guide, while purchasing asks about timing. Their comments stay with the proposal version they reviewed. The rep creates a revision of quote B rather than overwriting the original offer.","Engineering records what is custom, why it is needed, the labor hours, material cost and lead-time impact. Unpriced work must remain visibly incomplete and cannot be issued as a final offer. Once the change is reviewed, proposal V2 can include A Rev 0 and B Rev 1, with V1 still available.","The salesperson records the next action and owner in the deal. A list or board can make that follow-up visible across opportunities."],"transition":"These steps also reveal where sales time is being spent. That gives us a useful baseline for improvement."},{"id":"11-baseline","chapter":"The evaluation","title":"Understand where the sales process slows down","kind":"baseline","seconds":45,"onScreen":["Quote preparation","Approval waiting","Customer response","Sales outcomes"],"narration":["With an agreed sample of historical quotes and orders, we would map the current process and establish what the records can tell us: preparation time, waiting, revisions, outcomes and commonly sold configurations.","Those measures are different, so we would keep them separate. If records do not join up or outcomes are missing, the report would say so. A short evaluation can establish a baseline and expose friction; it cannot establish a sustained revenue or win-rate improvement."],"transition":"The free trial should leave you with useful work you can inspect, even if you decide not to continue."},{"id":"12-trial","chapter":"The evaluation","title":"Two weeks. Defined work you can evaluate.","subtitle":"Proposed scope · Agreed before the start","kind":"deliverables","seconds":60,"onScreen":["Focused quoting workflow","Sales-process baseline","Website content review","Evaluation & next-step plan"],"narration":["We propose two weeks at no fee, focused on one agreed product family and a small set of sales cases. Before the start, we would confirm the inputs, participants, implementation scope and review date together.","The proposed outputs are a working quoting flow for those cases, a baseline from the available sales records, a prioritized review of product content and AI-search observations, and a written evaluation with the next-step plan.","You receive the written findings, open issues and next-step priorities. The working flow lets your team evaluate the agreed cases; continued operation and further development are separate decisions.","The scope must fit the two weeks. A full website replacement, every product family and unagreed integrations are not implied by this demonstration."],"transition":"We should agree how your team will judge those outputs before we begin."},{"id":"13-acceptance","chapter":"The evaluation","title":"Your team runs the cases","kind":"acceptance","seconds":60,"onScreen":["Standard quote","Engineering requirement","Customer revision","Your team checks the result"],"narration":["At the review, PAC users would complete the agreed cases themselves: a standard quote, an engineering requirement and a customer-requested revision. We would check the result against the source prices, rules, lead times and scope.","We would also check that an incomplete engineering item cannot be issued, that the earlier offer remains intact and that the customer-facing proposal explains the alternatives clearly. We would record completed cases, remaining issues and any dependencies for production use.","That record gives both sides a basis for deciding whether to continue."],"transition":"If the workflow proves useful, continued service should have a clear job and a defined price."},{"id":"14-continuation","chapter":"The next step","title":"What happens after the trial?","kind":"continuation","seconds":60,"onScreen":["Operate & support","Maintain prices and rules","Agree improvements and separate growth work","No automatic charges"],"narration":["The ongoing service keeps the workflow usable as your prices, product options and customer requirements change. If we continue, the paid plan would cover the agreed operating service, support, maintenance and a defined allowance for improvements.","The content review also creates a separate list of opportunities: product questions to answer, application information to improve and search observations to revisit. You can decide which of those you want us to implement and measure.","We would confirm scope, fees and support in writing before paid service starts. Additional development and ongoing operation may have different costs. There are no automatic charges, and production launch still depends on the agreed readiness checks."],"transition":"The decision today is whether to define that focused evaluation together."},{"id":"15-start","chapter":"The next step","title":"Choose the first cases together","kind":"commitment","seconds":40,"onScreen":["Name the participants","Agree the product and cases","Confirm inputs and access","Set the start and review dates"],"narration":["Would you be comfortable defining the first product family and cases with us, naming the sales and engineering participants, and confirming who will make the evaluation decision?","We would document the required templates, prices, approval and CRM rules, relevant media and agreed data access. Once the scope and inputs are ready, we can set the start and review dates. You will know what to expect, how to assess it and what a later paid decision would involve."],"transition":"Let us begin with the product family and one representative customer application."}]};</script><script>/* === SCRIPT VIEW: spoken words and production notes live outside the audience view === */
const model=window.PAC_STORYBOARD;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='pac-new-storyboard-20261108';
const labels=['Sales in context','The outcome','A buyer’s question','Search evidence','The public website','Customer proposal','Requirements & selection','Configure alternatives','Review & publish','Feedback & revision','The sales baseline','Trial deliverables','Acceptance','Continued service','Agree the first cases'];
document.getElementById('notesNav').innerHTML=model.scenes.map((s,i)=>`<a class="scene-link" href="#${s.id}"><span class="number">${String(i+1).padStart(2,'0')}</span><span>${esc(labels[i])}</span></a>`).join('');
document.getElementById('scriptMain').innerHTML=model.scenes.map((s,i)=>`<article class="script-section" data-id="${s.id}"><div class="script-kicker">${String(i+1).padStart(2,'0')} / ${model.scenes.length} · ${esc(s.chapter)}</div><h1>${esc(s.title)}</h1><div class="script-duration">Suggested pace: ${s.seconds} seconds · ${Math.round(model.scenes.reduce((a,x)=>a+x.seconds,0)/60)} minutes total, before discussion</div><div class="script-label">Say</div><div class="script-copy">${s.narration.map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="script-label">Bridge to the next scene</div><div class="script-transition">${esc(s.transition)}</div>${s.evidence?`<aside class="production-note"><strong>Production notes · Not spoken</strong>${esc(s.evidence)}</aside>`:''}${s.sourceRefs&&model.sources?`<div class="source-list"><div class="script-label">Source trace</div>${s.sourceRefs.map(id=>`<p>${esc(model.sources.find(x=>x.id===id)?.label||id)}</p>`).join('')}</div>`:''}<nav class="script-nav">${i?`<a href="#${model.scenes[i-1].id}">← Previous scene</a>`:'<span></span>'}${i<model.scenes.length-1?`<a href="#${model.scenes[i+1].id}">Next scene →</a>`:''}</nav></article>`).join('');
function show(id,update=true){
 if(!model.scenes.some(s=>s.id===id))id=model.scenes[0].id;
 document.querySelectorAll('.script-section').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
 document.querySelectorAll('#notesNav a').forEach(a=>{if(a.hash==='#'+id)a.setAttribute('aria-current','step');else a.removeAttribute('aria-current')});
 document.getElementById('audienceLink').href='index.html#'+id;
 if(update)history.replaceState(null,'','#'+id);
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));
const channel='BroadcastChannel'in window?new BroadcastChannel(key):null;
channel?.addEventListener('message',event=>{if(event.data.type==='scene'&&document.getElementById('followSlides').checked)show(event.data.id)});
window.addEventListener('storage',event=>{if(event.key===key+'-active'&&document.getElementById('followSlides').checked)show(event.newValue)});
document.getElementById('printScript').onclick=()=>window.print();
show(location.hash.slice(1),false);
</script></body></html>
